<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Space Explorer – WebAR</title>

  <!-- A-Frame + AR.js (marker-based) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- Our own components -->
  <script src="js/components.js"></script>

  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; }
    #status {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 10px 18px; border-radius: 999px;
      font-size: 15px; font-weight: 600; color: #fff; white-space: nowrap;
      background: #c0392b; box-shadow: 0 4px 14px rgba(0,0,0,.35);
      transition: background .3s ease;
    }
    #status.found { background: #27ae60; }
    #hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 10; padding: 6px 12px; border-radius: 8px; width: max-content; max-width: 90vw;
      font-size: 13px; color: #fff; background: rgba(0,0,0,.6); text-align: center;
    }
  </style>
</head>
<body>
  <!-- 5. Status banner (driven by the marker-status component) -->
  <div id="status">🔭 Searching for the Hiro marker…</div>
  <div id="hint">Tap the blue planet to change its colour · Tap the rocket to launch it 🚀</div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true; colorManagement: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable">

    <a-assets>
      <!-- 3. glTF model: Astronaut (CC-BY, credited in README) -->
      <a-asset-item id="astronaut-model" src="models/astronaut.glb"></a-asset-item>
    </a-assets>

    <!-- 1. Hiro marker scene -->
    <a-marker preset="hiro" emitevents="true" marker-status="banner: #status">

      <!-- Space base platform (box) -->
      <a-box position="0 0 0" width="2" height="0.05" depth="2" color="#0b0f2a"></a-box>

      <!-- Title label (a-text) -->
      <a-text value="SPACE EXPLORER" position="0 0.04 0.9" rotation="-90 0 0"
              align="center" width="3" color="#7fdbff"></a-text>

      <!-- The Sun (sphere) - Animation 1: rotation -->
      <a-sphere position="0 0.55 0" radius="0.22" color="#ffb300"
                material="emissive: #ff8f00; emissiveIntensity: 0.8"
                animation="property: rotation; to: 0 360 0; dur: 8000; easing: linear; loop: true">
      </a-sphere>

      <!-- Saturn-style ring around the sun (torus) -->
      <a-torus position="0 0.55 0" radius="0.32" radius-tubular="0.008" rotation="75 0 0" color="#ffe082"></a-torus>

      <!-- Orbiting planet: parent spins (rotation), planet sits on the edge.
           4a. Workshop ball: tap the planet to change its colour. -->
      <a-entity position="0 0.55 0"
                animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true">
        <a-sphere class="clickable" position="0.6 0 0" radius="0.12" color="#2196f3" change-color></a-sphere>
      </a-entity>

      <!-- 3. Astronaut model, floating in zero-g - Animation 2: position -->
      <a-entity gltf-model="#astronaut-model" position="-0.65 0.1 -0.4" rotation="0 30 0" scale="0.3 0.3 0.3"
                animation="property: position; to: -0.65 0.3 -0.4; dir: alternate; dur: 2000; easing: easeInOutSine; loop: true">
      </a-entity>

      <!-- 4b. New tappable object: rocket (cylinder + cone), own component rocket-launch -->
      <a-entity id="rocket" class="clickable" position="0.65 0.03 -0.4" rocket-launch="flame: #flame">
        <a-cylinder position="0 0.2 0" radius="0.07" height="0.3" color="#eceff1"></a-cylinder>
        <a-cone position="0 0.42 0" radius-bottom="0.07" radius-top="0" height="0.14" color="#e53935"></a-cone>
        <a-box position="0 0.08 0" width="0.2" height="0.08" depth="0.03" color="#e53935"></a-box>
        <a-cone id="flame" position="0 0.0 0" rotation="180 0 0" radius-bottom="0.05" radius-top="0" height="0.12"
                color="#ff6d00" material="emissive: #ff3d00; emissiveIntensity: 1" visible="false"></a-cone>
      </a-entity>

      <!-- A few stars (small spheres) -->
      <a-sphere position="-0.8 0.9 0.6" radius="0.02" color="#fff"></a-sphere>
      <a-sphere position="0.85 1.0 0.5" radius="0.025" color="#fff"></a-sphere>
      <a-sphere position="0.3 1.1 -0.8" radius="0.02" color="#fff"></a-sphere>
      <a-sphere position="-0.3 1.2 -0.7" radius="0.018" color="#fff"></a-sphere>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
